services:
  redis:
    image: redis:7-alpine

  web:
    build: .
    environment:
      DATA_DIR: /data
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A celery_app.celery_app worker --loglevel=info --pool=solo --concurrency=1
    environment:
      DATA_DIR: /data
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./data:/data
    depends_on:
      - redis
